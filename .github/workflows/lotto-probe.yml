# 임시: GitHub 서버에서 어떤 로또 데이터 출처에 접속되는지 확인
name: lotto-probe
on:
  push:
    branches: [claude/nice-brahmagupta-ub1qv6]
    paths: [.github/workflows/lotto-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36"
          for u in \
            "https://www.dhlottery.co.kr/common.do?method=getLottoNumber&drwNo=1" \
            "https://dhlottery.co.kr/common.do?method=getLottoNumber&drwNo=1" \
            "https://m.dhlottery.co.kr/common.do?method=getLottoNumber&drwNo=1" \
            "https://smok95.github.io/lotto/results/latest.json" \
            "https://smok95.github.io/lotto/results/1.json" \
            "https://search.naver.com/search.naver?query=%EB%A1%9C%EB%98%90+1%ED%9A%8C+%EB%8B%B9%EC%B2%A8%EB%B2%88%ED%98%B8" \
            "https://m.search.naver.com/search.naver?query=%EB%A1%9C%EB%98%90+1%ED%9A%8C+%EB%8B%B9%EC%B2%A8%EB%B2%88%ED%98%B8" ; do
            echo "=== $u"
            curl -sS -L -m 15 -A "$UA" -o body.txt -w "HTTP %{http_code} %{size_download}B\n" "$u" || echo "FAILED"
            head -c 400 body.txt; echo
          done
          echo "=== smok95 all.json"
          curl -sS -L -m 30 -o all.json -w "HTTP %{http_code} %{size_download}B\n" https://smok95.github.io/lotto/results/all.json && head -c 600 all.json && echo && tail -c 400 all.json
          echo "=== naver 숫자 부분"
          curl -sS -L -m 15 -A "$UA" "https://search.naver.com/search.naver?query=%EB%A1%9C%EB%98%90+1%ED%9A%8C+%EB%8B%B9%EC%B2%A8%EB%B2%88%ED%98%B8" | grep -o 'ball[^>]*>[0-9]*<' | head -20
