# 임시: 네이버 로또 결과 HTML 구조 확인
name: lotto-probe
on:
  push:
    branches: [claude/nice-brahmagupta-ub1qv6]
    paths: [.github/workflows/lotto-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36"
          for r in 1245 1246 1100; do
            echo "======== $r"
            curl -sS -L -m 15 -A "$UA" "https://search.naver.com/search.naver?query=$(python3 -c "import urllib.parse;print(urllib.parse.quote('로또 ${r}회 당첨번호'))")" -o n.html
            python3 - <<'PY'
          import re
          h = open("n.html", encoding="utf-8").read()
          i = h.find('ball type')
          print("first ball at", i)
          seg = h[max(0, i - 2500): i + 1500]
          seg = re.sub(r"\s+", " ", seg)
          print(seg)
          print("--- 회차 패턴:", re.findall(r"(\d{3,4})회차", h)[:10])
          print("--- select option:", re.findall(r'<option[^>]*>(\d{3,4})회[^<]*</option>', h)[:5])
          PY
          done
