# 매주 토요일 21:00(KST)에 새 로또 회차를 받아 통계 리포트와 웹페이지 데이터를 갱신하고 커밋한다.
# 주의: GitHub의 schedule은 "기본 브랜치"에 있는 워크플로만 실행된다.
name: 로또 주간 업데이트

on:
  schedule:
    - cron: "0 12 * * 6"   # 토 12:00 UTC = 토 21:00 KST
    - cron: "0 0 * * 0"    # 일 00:00 UTC = 일 09:00 KST (토요일에 결과가 늦게 올라온 경우 재시도)
  workflow_dispatch:        # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: lotto-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lotto-analyzer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 테스트
        run: python -m unittest discover -s tests

      - name: 새 회차 받아오기
        run: python -m lotto_analyzer update

      - name: 새 회차가 있으면 리포트 갱신 후 커밋
        run: |
          if [ -z "$(git status --porcelain data/draws.json)" ]; then
            echo "새 회차 없음 (아직 결과가 안 올라왔거나 이미 최신)"
            exit 0
          fi
          python -m lotto_analyzer report --out REPORT.md
          python -m lotto_analyzer web
          LATEST=$(python -c "import json;print(json.load(open('data/draws.json'))[-1]['round'])")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/draws.json data/web.json REPORT.md
          git add data/picks.json 2>/dev/null || true
          git commit -m "로또 ${LATEST}회 당첨번호 반영 및 통계 갱신"
          git pull --rebase
          git push
