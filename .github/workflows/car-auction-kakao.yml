# 경매 매물 목록(car-auction/data/listings.json)이 바뀌면
# 조건(K3·아반떼 / 19~20년식 / 7만km 이하 / 흰색·검정)에 맞는 새 매물을 카카오톡 '나에게 보내기'로 알린다.
# 같은 차는 data/notified.json에 기록해서 한 번만 보낸다.
# 카톡 시크릿은 로또 알림과 같은 것(KAKAO_REST_API_KEY, KAKAO_REFRESH_TOKEN 등)을 그대로 쓴다.
# 주의: 기본 브랜치에 push될 때만 자동 실행된다.
# Actions 탭 → 경매 매물 카톡 알림 → Run workflow 에서 '테스트 메시지'를 켜면 카톡 연결만 확인할 수 있다.
name: 경매 매물 카톡 알림

on:
  push:
    branches: [claude/lottery-win-simulator-e9ubtt]   # 이 저장소의 기본 브랜치
    paths:
      - car-auction/data/listings.json
      - car-auction/data/criteria.json
  workflow_dispatch:
    inputs:
      test:
        description: "테스트 메시지 한 통만 보내기 (카톡 연결 확인용)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: car-auction-data
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: car-auction
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 테스트
        run: python -m unittest discover -s tests

      - name: 조건 일치 새 매물 카카오톡 전송
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_NEW_REFRESH_TOKEN_FILE: ${{ runner.temp }}/new_refresh_token
        run: python car_alert.py --send ${{ inputs.test && '--test' || '' }}

      - name: 카카오 refresh_token이 새로 나왔으면 시크릿 갱신
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          NEW_TOKEN_FILE: ${{ runner.temp }}/new_refresh_token
        run: |
          if [ ! -s "$NEW_TOKEN_FILE" ]; then
            echo "토큰 변경 없음"
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::카카오 refresh_token이 새로 발급됐지만 GH_PAT가 없어 자동 갱신하지 못했습니다."
            exit 0
          fi
          gh secret set KAKAO_REFRESH_TOKEN --repo "${{ github.repository }}" < "$NEW_TOKEN_FILE"
          echo "KAKAO_REFRESH_TOKEN 시크릿을 갱신했습니다."

      - name: 보낸 매물 기록 커밋
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/notified.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "경매 매물 카톡 알림 기록"
          git pull --rebase
          git push
