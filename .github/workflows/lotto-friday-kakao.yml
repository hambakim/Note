# 매주 금요일 18:00(KST)에 이번 주 추천 10게임을 만들어 카카오톡 '나에게 보내기'로 전송한다.
# 주의: GitHub의 schedule은 "기본 브랜치"에 있는 워크플로만 실행되고, 몇 분~수십 분 늦을 수 있다.
#
# 필요한 저장소 시크릿 (Settings → Secrets and variables → Actions)
#   KAKAO_REST_API_KEY   카카오 REST API 키
#   KAKAO_REFRESH_TOKEN  `python -m lotto_analyzer kakao login`으로 받은 값
#   KAKAO_CLIENT_SECRET  (선택) 클라이언트 시크릿을 켠 경우
#   GH_PAT               (선택) 카카오 토큰이 새로 나오면 위 시크릿을 자동 갱신하기 위한 개인 토큰
name: 로또 금요일 카톡 추천

on:
  schedule:
    - cron: "0 9 * * 5"   # 금 09:00 UTC = 금 18:00 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lotto-data
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lotto-analyzer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 혹시 빠진 회차가 있으면 받기 (실패해도 저장된 데이터로 진행)
        run: python -m lotto_analyzer update
        continue-on-error: true

      - name: 추천 10게임 만들고 카카오톡 전송
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_NEW_REFRESH_TOKEN_FILE: ${{ runner.temp }}/new_refresh_token
        run: python -m lotto_analyzer weekly --send

      - name: 카카오 refresh_token이 새로 나왔으면 시크릿 갱신
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          NEW_TOKEN_FILE: ${{ runner.temp }}/new_refresh_token
        run: |
          if [ ! -s "$NEW_TOKEN_FILE" ]; then
            echo "토큰 변경 없음"
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::카카오 refresh_token이 새로 발급됐지만 GH_PAT가 없어 자동 갱신하지 못했습니다. 내 PC에서 'kakao login'을 다시 해서 KAKAO_REFRESH_TOKEN 시크릿을 바꿔 주세요."
            exit 0
          fi
          gh secret set KAKAO_REFRESH_TOKEN --repo "${{ github.repository }}" < "$NEW_TOKEN_FILE"
          echo "KAKAO_REFRESH_TOKEN 시크릿을 갱신했습니다."

      - name: 추천 기록 커밋 (토요일 결과 확인용) + 웹페이지 데이터 갱신
        if: ${{ !cancelled() }}   # 카톡 전송이 실패해도 웹페이지에는 이번 주 번호가 올라가게
        run: |
          python -m lotto_analyzer web
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/picks.json data/draws.json data/web.json
          if git diff --cached --quiet; then exit 0; fi
          ROUND=$(python -c "import json;print(max(map(int, json.load(open('data/picks.json')))))")
          git commit -m "로또 ${ROUND}회 추천 조합 기록"
          git pull --rebase
          git push
